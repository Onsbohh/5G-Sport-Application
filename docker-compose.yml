services:
  frontend:
    build: ./frontend
    container_name: 5g-sport-frontend
    env_file: ./frontend/.env
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      - CI=true
    stdin_open: true
    tty: true
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: 5g-sport-mediamtx
    ports:
      - "8554:8554"
      - "8889:8889"