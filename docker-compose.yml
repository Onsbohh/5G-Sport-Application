services:
  frontend:
    build: ./frontend
    container_name: 5g-sport-frontend
    env_file: ./frontend/.env
    environment:
      - WATCHPACK_POLLING=true
      - CI=true
    stdin_open: true
    tty: true
  server:
    build: ./server
    container_name: 5g-sport-server
    depends_on:
      - mediamtx
    devices:
      - /dev/video0:/dev/video0
    privileged: true
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: 5g-sport-mediamtx
  nginx:
    image: nginx:latest
    container_name: 5g-sport-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - server
      - mediamtx
